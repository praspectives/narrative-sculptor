[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storytellers-forge"
version = "0.2.0"
description = "macOS utility to transform raw dictated thoughts into polished narratives using local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev-api = [
    "anthropic>=0.30.0",
    "openai>=1.40.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
